services:
  postgres:
    image: postgres:16-alpine
    container_name: varta-prod-postgres
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-varta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-varta_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-varta_db}
    volumes:
      - varta_prod_pgdata:/var/lib/postgresql/data
      - ../database_backup/varta_backup.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varta_user} -d ${POSTGRES_DB:-varta_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    networks:
      - varta-prod-net

  redis:
    image: redis:7.2-alpine
    container_name: varta-prod-redis
    restart: always
    env_file:
      - ../.env
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
        redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\";
      else
        redis-server --appendonly yes;
      fi"
    volumes:
      - varta_prod_redisdata:/data
    healthcheck:
      test: >
        sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
          redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG;
        else
          redis-cli ping | grep PONG;
        fi"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - varta-prod-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: varta-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-varta_user}:${POSTGRES_PASSWORD:-varta_secure_password_123}@postgres:5432/${POSTGRES_DB:-varta_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3051:3001" # Bound only to localhost for Nginx reverse proxy
    volumes:
      - varta_prod_media:/app/uploads
      - varta_prod_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - varta-prod-net

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: varta-prod-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-varta_user}:${POSTGRES_PASSWORD:-varta_secure_password_123}@postgres:5432/${POSTGRES_DB:-varta_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    volumes:
      - varta_prod_media:/app/uploads
      - varta_prod_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - varta-prod-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://varta.kevindevops.online}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://varta.kevindevops.online/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://varta.kevindevops.online}
    container_name: varta-prod-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3050:3000" # Bound only to localhost for Nginx reverse proxy
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    networks:
      - varta-prod-net

networks:
  varta-prod-net:
    name: varta-network
    driver: bridge

volumes:
  varta_prod_pgdata:
    name: varta_pgdata
  varta_prod_redisdata:
    name: varta_redisdata
  varta_prod_media:
    name: varta_media
  varta_prod_logs:
    name: varta_logs
